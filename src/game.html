<title>Current</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0A0C0D; --substrate:#101416; --panel:#151A1C;
    --edge:#232A2D; --edge-hi:#31393D;
    --copper:#C87137; --copper-lo:#8A5028;
    --hot:#FF5A3C; --lamp:#FFE7B8; --cold:#5B8FB8;
    --ink:#EDE6DC; --muted:#8A8378; --dim:#575249; --ok:#9FD8A8;
    --f-disp:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
    --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{background:var(--ground);color:var(--ink);font-family:var(--f-body);
       touch-action:none;user-select:none;-webkit-user-select:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ground);
       max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

  /* HUD */
  #hud{flex:0 0 auto;display:flex;gap:1px;background:var(--edge);border-bottom:1px solid var(--edge)}
  .cell{flex:1;background:var(--panel);padding:8px 11px 7px;display:flex;flex-direction:column;gap:3px;min-width:0}
  .cell .k{font-family:var(--f-disp);font-size:9px;font-weight:600;letter-spacing:.14em;
           text-transform:uppercase;color:var(--dim);white-space:nowrap}
  .cell .v{font-family:var(--f-mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;
           line-height:1;color:var(--ink);white-space:nowrap}
  .cell .v small{font-size:9.5px;color:var(--muted);margin-left:1px;font-weight:400}
  #cell-volts .v{color:var(--copper)}
  #cell-combo .v{color:var(--ok)}
  #cell-combo.flat .v{color:var(--dim)}
  .cell.hidden{display:none}
  #copperbar{height:4px;background:#0C0F10;border-radius:2px;overflow:hidden;margin-top:2px}
  #copperfill{height:100%;width:100%;background:var(--copper);transition:width .16s cubic-bezier(.22,.68,.24,1),background .25s}
  #copperfill.low{background:var(--hot)}

  /* chapter strip - where you are and how far to the boss */
  #chapbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
           gap:10px;padding:6px 14px 7px;background:var(--panel);
           border-bottom:1px solid var(--edge)}
  #chapname{font-family:var(--f-disp);font-size:10px;font-weight:600;letter-spacing:.17em;
            text-transform:uppercase;color:var(--dim);white-space:nowrap;
            overflow:hidden;text-overflow:ellipsis}
  #chapname b{color:var(--copper);font-weight:600}
  #chappips{display:flex;gap:6px;align-items:center;flex:0 0 auto}
  #chappips i{width:13px;height:3px;border-radius:1px;background:var(--edge-hi);
              transition:background .2s}
  #chappips i.done{background:var(--copper)}
  #chappips i.now{background:var(--ink);box-shadow:0 0 6px rgba(237,230,220,.55)}
  #chappips i.boss{width:8px;height:8px;border-radius:50%;background:transparent;
                   border:1.5px solid var(--edge-hi)}
  #chappips i.boss.done{background:var(--copper);border-color:var(--copper)}
  #chappips i.boss.now{background:var(--hot);border-color:var(--hot);
                       box-shadow:0 0 9px rgba(255,90,60,.75)}

  #bosscard{position:absolute;left:0;right:0;top:26%;text-align:center;pointer-events:none;
            opacity:0;transition:opacity .5s ease-out;padding:0 22px}
  #bosscard.show{opacity:1}
  #bosscard .bk{font-family:var(--f-disp);font-size:10px;font-weight:600;letter-spacing:.32em;
                text-transform:uppercase;color:var(--hot);display:block;margin-bottom:9px}
  #bosscard .bt{font-family:var(--f-disp);font-size:min(38px,9vw);font-weight:700;
                letter-spacing:.07em;text-transform:uppercase;color:var(--ink);
                display:block;line-height:1.05}
  #bosscard .bb{font-family:var(--f-mono);font-size:12px;color:var(--muted);
                display:block;margin-top:11px;line-height:1.5}

  /* board */
  #stagewrap{flex:1 1 auto;position:relative;min-height:0;background:var(--substrate)}
  #board{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:var(--f-disp);
        font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
        pointer-events:none;transition:opacity .4s;line-height:1.95}
  #hint b{color:var(--muted)}
  #titlecard{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;
             opacity:0;transition:opacity .7s ease-out}
  #titlecard.show{opacity:1}
  #titlecard .tn{font-family:var(--f-disp);font-size:min(52px,11.5vw);font-weight:700;
                 letter-spacing:.26em;text-transform:uppercase;color:var(--copper);
                 text-indent:.26em;line-height:1;display:block}
  #titlecard .ts{display:block;font-family:var(--f-mono);font-size:11px;color:var(--dim);
                 margin-top:12px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  #banner{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:var(--f-disp);
          font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
          color:var(--cold);pointer-events:none;opacity:0;transition:opacity .35s}
  #verdict{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;
           font-family:var(--f-disp);font-weight:700;letter-spacing:.19em;text-transform:uppercase;
           font-size:25px;opacity:0;transition:opacity .18s}
  #verdict .sub{display:block;font-family:var(--f-mono);font-size:11px;font-weight:400;
                letter-spacing:.04em;text-transform:none;color:var(--muted);margin-top:7px}

  /* meter */
  #meter{position:relative;flex:0 0 auto;background:var(--panel);border-top:1px solid var(--edge);
         padding:10px 62px 12px 14px;display:flex;flex-direction:column;gap:8px}
  #meterhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  #meterhead .k{font-family:var(--f-disp);font-size:9px;font-weight:600;letter-spacing:.14em;
                text-transform:uppercase;color:var(--dim)}
  #readout{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
  #readout b{color:var(--ink);font-weight:500}
  .gauge{position:relative;height:22px;background:#0C0F10;border:1px solid var(--edge);
         border-radius:3px;overflow:hidden}
  .gauge+.gauge{margin-top:4px}
  .gwin{position:absolute;top:0;bottom:0;background:rgba(159,216,168,.13);
        border-left:1px solid rgba(159,216,168,.5);border-right:1px solid rgba(159,216,168,.5)}
  .gtick{position:absolute;top:0;width:1px;height:5px;background:var(--edge-hi)}
  .gneedle{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink);left:0;
           box-shadow:0 0 7px rgba(237,230,220,.7);
           transition:left .14s cubic-bezier(.22,.68,.24,1),background .15s}
  .gneedle.in{background:var(--ok);box-shadow:0 0 9px rgba(159,216,168,.8)}
  .gneedle.over{background:var(--hot);box-shadow:0 0 9px rgba(255,90,60,.9)}
  .glab{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-family:var(--f-disp);
        font-size:8.5px;font-weight:600;letter-spacing:.13em;color:var(--dim);pointer-events:none}
  #gaugelabels{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9px;
               color:var(--dim);font-variant-numeric:tabular-nums;margin-top:-2px}
  #mute{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:48px;height:48px;
        display:flex;align-items:center;justify-content:center;background:none;border:none;
        cursor:pointer;color:var(--dim);transition:color .12s}
  #mute:hover,#mute:focus-visible{color:var(--ink);outline:none}
  #mute svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
            stroke-linecap:round;stroke-linejoin:round}
  #mute .slash{opacity:0}
  #mute.off{color:var(--hot)}
  #mute.off .slash{opacity:1}
  #mute.off .waves{opacity:0}

  /* overlays */
  .overlay{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;
           justify-content:center;align-items:center;background:rgba(10,12,13,.97);padding:20px;gap:16px;overflow-y:auto}
  .overlay.show{display:flex}
  .otitle{font-family:var(--f-disp);font-size:11px;font-weight:600;letter-spacing:.22em;
          text-transform:uppercase;color:var(--dim);text-align:center}
  .obig{font-family:var(--f-disp);font-size:31px;font-weight:700;letter-spacing:.05em;
        text-transform:uppercase;color:var(--ink);text-align:center;line-height:1}
  #cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:330px}
  .card{background:var(--panel);border:1px solid var(--edge);border-left:2px solid var(--copper);
        border-radius:2px;padding:14px 15px;min-height:48px;cursor:pointer;text-align:left;display:flex;
        flex-direction:column;gap:4px;font:inherit;color:inherit;
        transition:border-color .12s,background .12s,transform .08s}
  .card:hover,.card:focus-visible{background:#1B2124;border-left-color:var(--lamp);outline:none}
  .card:active{transform:translateY(1px)}
  .card .cn{font-family:var(--f-disp);font-size:13.5px;font-weight:600;letter-spacing:.05em;
            text-transform:uppercase;color:var(--lamp)}
  .card .cd{font-size:12px;color:var(--muted);line-height:1.4}
  .card .cv{font-family:var(--f-mono);font-size:10.5px;color:var(--copper)}
  #stats{display:flex;gap:1px;background:var(--edge);border:1px solid var(--edge);width:100%;
         max-width:330px;border-radius:2px;overflow:hidden}
  #stats div{flex:1;background:var(--panel);padding:10px 6px;text-align:center}
  #stats .k{font-family:var(--f-disp);font-size:8.5px;font-weight:600;letter-spacing:.11em;
            text-transform:uppercase;color:var(--dim);display:block;margin-bottom:4px}
  #stats .v{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
  .btn{font-family:var(--f-disp);font-size:13px;font-weight:700;letter-spacing:.17em;
       text-transform:uppercase;background:var(--copper);color:#120A04;border:none;border-radius:2px;
       min-height:48px;padding:14px 30px;cursor:pointer;transition:background .12s}
  .btn:hover,.btn:focus-visible{background:#DE8244;outline:none}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--edge)}
  .btn.ghost:hover{background:#1B2124;color:var(--ink)}
  .btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  #overwhy{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;
           max-width:300px;line-height:1.55}
  #overwhy b{color:var(--hot);font-weight:500}

  /* re-solder prompt */
  #resolder{position:absolute;inset:0;z-index:11;display:none;flex-direction:column;
            justify-content:center;align-items:center;background:rgba(10,12,13,.9);gap:15px;padding:22px}
  #resolder.show{display:flex}
  #resolder .obig{font-size:26px;color:var(--hot)}
  #rcount{font-family:var(--f-mono);font-size:11.5px;color:var(--dim)}

  /* lab */
  #labgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:360px}
  .node{background:var(--panel);border:1px solid var(--edge);border-radius:2px;padding:12px 11px;min-height:48px;
        text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;
        gap:5px;transition:border-color .12s,background .12s}
  .node:hover:not(:disabled){background:#1B2124;border-color:var(--copper)}
  .node:disabled{cursor:default;opacity:.45}
  .node .nn{font-family:var(--f-disp);font-size:11.5px;font-weight:600;letter-spacing:.05em;
            text-transform:uppercase;color:var(--ink)}
  .node .nd{font-size:10.5px;color:var(--muted);line-height:1.35}
  .node .nf{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:1px}
  .pips{display:flex;gap:3px}
  .pips i{width:11px;height:3px;background:var(--edge-hi);border-radius:1px}
  .pips i.on{background:var(--copper)}
  .node .cost{font-family:var(--f-mono);font-size:10px;color:var(--copper)}
  .node .cost.max{color:var(--ok)}
  #rp{font-family:var(--f-mono);font-size:13px;color:var(--copper);font-variant-numeric:tabular-nums}
  #unlockbar{width:100%;max-width:330px}
  #unlockbar .lab{display:flex;justify-content:space-between;font-family:var(--f-mono);
                  font-size:10.5px;color:var(--dim);margin-bottom:5px}
  #ubtrack{height:5px;background:#0C0F10;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
  #ubfill{height:100%;background:var(--copper);width:0%;transition:width .5s ease-out}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>

<div id="app">
  <div id="hud">
    <div class="cell"><span class="k">Stage</span><span class="v" id="v-stage">1</span></div>
    <div class="cell" id="cell-volts"><span class="k">Supply</span><span class="v" id="v-volts">12.0<small>V</small></span></div>
    <div class="cell" id="cell-combo"><span class="k">Chain</span><span class="v" id="v-combo">×1.0</span></div>
    <div class="cell" id="cell-score"><span class="k">Score</span><span class="v" id="v-score">0</span></div>
    <div class="cell" style="flex:1.05"><span class="k">Copper</span>
      <span class="v" id="v-copper">100<small>%</small></span>
      <div id="copperbar"><div id="copperfill"></div></div></div>
  </div>

  <div id="chapbar">
    <span id="chapname">&mdash;</span>
    <span id="chappips"></span>
  </div>

  <div id="stagewrap">
    <canvas id="board"></canvas>
    <div id="banner"></div>
    <div id="bosscard"><span class="bk">Boss</span><span class="bt" id="bosstitle"></span><span class="bb" id="bossblurb"></span></div>
    <div id="titlecard"><span class="tn">Current</span><span class="ts" id="titlesub"></span></div>
    <div id="hint"></div>
    <div id="verdict"></div>

    <div id="resolder">
      <div class="otitle">Trace opened</div>
      <div class="obig">Re-solder?</div>
      <div id="overwhy2" style="font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;max-width:290px;line-height:1.55"></div>
      <div class="btnrow">
        <button class="btn" id="do-resolder">Re-solder</button>
        <button class="btn ghost" id="no-resolder">End run</button>
      </div>
      <div id="rcount"></div>
    </div>

    <div class="overlay" id="draft">
      <div><div class="otitle" style="margin-bottom:6px">Stage cleared &mdash; requisition</div>
           <div class="obig" id="draft-big">Pick one</div></div>
      <div id="cards"></div>
    </div>

    <div class="overlay" id="over">
      <div><div class="otitle" style="margin-bottom:6px" id="over-title">Run ended</div>
           <div class="obig" id="over-big">Burned out</div></div>
      <div id="overwhy"></div>
      <div id="stats">
        <div><span class="k" id="s-stage-k">Stages</span><span class="v" id="s-stage">0</span></div>
        <div><span class="k" id="s-score-k">Score</span><span class="v" id="s-score">0</span></div>
        <div><span class="k" id="s-best-k">Best</span><span class="v" id="s-best">0</span></div>
        <div><span class="k" id="s-rp-k">Research</span><span class="v" id="s-rp">0</span></div>
      </div>
      <div id="unlockbar">
        <div class="lab"><span id="ubname">&mdash;</span><span id="ubval"></span></div>
        <div id="ubtrack"><div id="ubfill"></div></div>
      </div>
      <div class="btnrow">
        <button class="btn" id="again">Run again</button>
        <button class="btn ghost" id="todaily">Daily</button>
        <button class="btn ghost" id="tolab">Lab</button>
      </div>
    </div>

    <div class="overlay" id="lab">
      <div><div class="otitle" style="margin-bottom:6px">Permanent upgrades</div>
           <div class="obig">Lab</div></div>
      <div id="rp">0 RP</div>
      <div id="labgrid"></div>
      <button class="btn" id="labclose">Back</button>
    </div>
  </div>

  <div id="meter">
    <div id="meterhead"><span class="k" id="meterlabel">Load current</span><span id="readout">&mdash;</span></div>
    <button id="mute" aria-label="Mute sound"><svg viewBox="0 0 24 24">
      <path d="M4 9v6h4l5 4V5L8 9H4z"/>
      <g class="waves"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></g>
      <g class="slash"><path d="M17 9.5l5 5"/><path d="M22 9.5l-5 5"/></g>
    </svg></button>
    <div id="gauges"></div>
    <div id="gaugelabels"><span>0</span><span id="gmid">450</span><span id="gmax">900 mA</span></div>
  </div>
</div>

<script>
"use strict";
/* ================================================================
   CURRENT v2
   Series circuits, parallel branches, a supply fuse, persistent
   research upgrades, a crafted teaching stage and adaptive pacing.

     R_seg = ρ·L/w      I_branch = V / (R_branch + ΣR_load)
     q     = I²·ρ/w²    dH/dt = q·Kh − H·Kc + k∇²H
   Parallel branches off an ideal supply are independent, so each
   branch solves on its own and the supply carries their sum.
   ================================================================ */

const CFG = {
  BW:10, RHO:0.60, R_LOAD:20,
  I_MIN:0.25, I_MAX:0.55,
  W_MIN:0.085, W_MAX:0.45,
  SPEED_MAX:11, STEP:0.12,
  K_HEAT:0.275, K_COOL:0.55, K_DIFF:3.0, H_BURN:1.0,
  LIVE_MS:2600, DARK_MS:1150,
  I_REF:0.34, W_REF:0.30, V_RAMP:0.075,
  BUDGET:(d)=> d*0.46 + 0.70,
  GAUGE_MAX:0.9, DRAFT_EVERY:2,
  FUSE_PARALLEL:0.80,      // supply fuse, parallel boards only (amps)
  MIN_MARGIN:0.14,         // every board must be solvable with this much headroom
  MIN_MARGIN_BOSS:0.07,    // a boss may bite, but still cannot be unwinnable
  CHAPTER_LEN:6,           // learn - build - build - build - build - boss
  SLOWMO_MS:900
};

const $ = (id)=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
// Board generation draws from RND, not Math.random, so the daily board can be
// seeded from the date and come out identical for everyone. Audio noise keeps
// using Math.random; it is not part of the puzzle.
let RND = Math.random;
const mulberry32 = (a)=>()=>{
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const dayNum = ()=> Math.floor(Date.now()/86400000);
const rand=(a,b)=>a+RND()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const mA=(x)=>Math.round(x*1000);

/* ---------------- audio ---------------- */
const A = {
  ctx:null, ok:false,
  init(){
    if (this.ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const c=new AC(); this.ctx=c;
    this.master=c.createGain(); this.master.gain.value=META.muted?0:0.55; this.master.connect(c.destination);
    const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate), d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    this.nb=nb;
    this.o1=c.createOscillator(); this.o1.type='sawtooth'; this.o1.frequency.value=60;
    this.o2=c.createOscillator(); this.o2.type='sine'; this.o2.frequency.value=120;
    this.lp=c.createBiquadFilter(); this.lp.type='lowpass'; this.lp.frequency.value=420;
    this.humG=c.createGain(); this.humG.gain.value=0;
    this.o1.connect(this.lp); this.o2.connect(this.lp); this.lp.connect(this.humG); this.humG.connect(this.master);
    this.o1.start(); this.o2.start();
    const mk=(f,q)=>{ const s=c.createBufferSource(); s.buffer=nb; s.loop=true;
      const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=q;
      const g=c.createGain(); g.gain.value=0; s.connect(bp); bp.connect(g); g.connect(this.master); s.start(); return g; };
    this.szG=mk(2600,1.1); this.scG=mk(1000,0.8);
    this.ok=true;
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  set(n,v,t){ if(!this.ok)return; n.gain.cancelScheduledValues(this.ctx.currentTime);
              n.gain.setTargetAtTime(v,this.ctx.currentTime,t||0.05); },
  hum(cur,heat){ if(!this.ok)return;
    this.set(this.humG, cur>0.01?clamp(cur,0,1)*0.30:0, 0.05);
    this.o1.frequency.setTargetAtTime(60+cur*26,this.ctx.currentTime,0.1);
    this.set(this.szG, heat>0.45?(heat-0.45)*0.32:0, 0.04); },
  scratch(v){ if(!this.ok)return; this.set(this.scG, clamp(v,0,1)*0.075, 0.03); },
  tone(f,dur,type,vol,to){ if(!this.ok)return; const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(vol||0.2,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02); },
  noise(dur,f,vol){ if(!this.ok)return; const c=this.ctx,t=c.currentTime;
    const s=c.createBufferSource(); s.buffer=this.nb;
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=0.7;
    const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(bp); bp.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur+0.02); },
  pop(){ this.noise(0.30,1700,0.42); this.tone(260,0.26,'sawtooth',0.26,45); },
  trip(){ this.tone(150,0.10,'square',0.22); setTimeout(()=>this.tone(110,0.22,'square',0.18,60),90); },
  ding(){ this.tone(659,0.5,'sine',0.17); setTimeout(()=>this.tone(988,0.65,'sine',0.12),80); },
  chain(n){ this.tone(523*Math.pow(1.0595,Math.min(n,9)*2),0.34,'triangle',0.15); },
  clack(){ this.noise(0.05,3000,0.16); },
  nope(){ this.tone(110,0.16,'square',0.10,70); }
};

/* ---------------- chapters ---------------- */
// Boards stay procedural - a solo developer cannot hand-author hundreds - but
// they are grouped into named sectors that end in a boss with its own rule.
// You remember clearing the Foundry. You do not remember clearing stage 17.
const CHAPTERS = [

    boss:{ title:'The Long Run', blurb:'One lamp. The far corner. No cover.',

  { name:'Substation',  sub:'#0E1519', grid:'rgba(150,200,235,0.055)',
    boss:{ title:'Split Decision', blurb:'Two branches, one fuse, and it is tight.',
           kind:'parallel', fuse:0.86, obs:-1 } },
  { name:'The Foundry', sub:'#171110', grid:'rgba(255,150,90,0.055)',
    boss:{ title:'Thermal Runaway', blurb:'The board runs hot. Copper sheds heat slowly here.',
           kind:'series', cool:0.62 } },
  { name:'Deep Freeze', sub:'#0D1418', grid:'rgba(170,220,255,0.06)',
    boss:{ title:'Chain of Three', blurb:'Three lamps. One current through all of them.',
           kind:'triple' } },
  { name:'The Grid',    sub:'#121316', grid:'rgba(237,230,220,0.05)',
    boss:{ title:'The Gauntlet', blurb:'Every keep-out zone they had.',

  { name:'Reactor',     sub:'#180F14', grid:'rgba(255,120,140,0.055)',
    boss:{ title:'Overload', blurb:'The supply climbs while you watch. Leave yourself room.',

const chapIdx  = (st)=> Math.floor((st-1)/CFG.CHAPTER_LEN) % CHAPTERS.length;
const chapNum  = (st)=> Math.floor((st-1)/CFG.CHAPTER_LEN) + 1;
const chapStep = (st)=> ((st-1) % CFG.CHAPTER_LEN) + 1;
const isBoss   = (st)=> chapStep(st) === CFG.CHAPTER_LEN;
const isTeaching = (st)=> st === 4 || st === 7;   // series, then parallel
const chapter  = (st)=> CHAPTERS[chapIdx(st)];

/* ---------------- persistent meta ---------------- */
const UPG = [
  {id:'copper',   n:'Purer copper',   d:'Lower resistivity in every trace you draw.',   max:3, eff:'ρ −4% / level',       cost:l=>40+l*55},
  {id:'stock',    n:'Thicker stock',  d:'Wider maximum trace at the same drag speed.',  max:3, eff:'w max +6% / level',   cost:l=>50+l*60},

  {id:'substrate',n:'Better substrate',d:'The board pulls heat out of traces faster.',   max:3, eff:'cooling +10% / level',cost:l=>60+l*70},

];
const DEF_META = { rp:0, best:0, runs:0, skill:1, muted:false, taught:false,
  dailyDay:null, streak:0, freezes:0, daysPlayed:0, dailyBest:0, up:{copper:0,stock:0,reserves:0,substrate:0,lamps:0,solder:0} };

const lvl = (id)=>META.up[id]||0;

/* ---------------- mute ---------------- */

/* ---------------- run state ---------------- */
const S = {
  stage:1, score:0, phase:'draw', type:'single',
  branches:[], lamps:[], obs:[], src:{x:0,y:0},
  volts:12, budget:5, copperUsed:0, fuse:1,
  bi:0, viaHit:false, drawing:false,
  liveT:0, maxHeat:0, burn:null, supplyI:0,
  chain:0, solder:1, rpRun:0, daily:false, breather:false, needBreather:false, sawChain:false, freeze:0,
  parts:[], shake:0, slowmo:0, dashOff:0, taught:false, hintLevel:0,
  mods:{rho:1,burn:1,cool:1,wmax:1,wmin:1,budget:1,imax:1,volt:1,score:1,diff:1}
};
function baseMods(){
  return { rho: 1 - 0.04*lvl('copper'),
           burn:1,
           cool: 1 + 0.10*lvl('substrate'),
           wmax: 1 + 0.06*lvl('stock'),
           wmin: 1,
           budget: 1 + 0.08*lvl('reserves'),
           imax: 1 + 0.05*lvl('lamps'),
           volt: 1, score: 1, diff: 1 };
}
const rho  =()=>CFG.RHO*S.mods.rho;
const wMax =()=>CFG.W_MAX*S.mods.wmax;
const wMin =()=>CFG.W_MIN*S.mods.wmin;
const iMax =()=>CFG.I_MAX*S.mods.imax;
const hBurn=()=>CFG.H_BURN*S.mods.burn;

/* ---------------- canvas ---------------- */
const cv=$("board"), cx=cv.getContext("2d");
let unit=40, BH=14, cssW=0, cssH=0;
function resize(){
  const r=cv.getBoundingClientRect(); cssW=r.width; cssH=r.height;
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
  cx.setTransform(dpr,0,0,dpr,0,0);
  unit=cssW/CFG.BW; BH=cssH/unit;
}
const px=(u)=>u*unit;

/* ---------------- board generation ---------------- */
function rectHit(p,r,pad){ return p.x>r.x-pad&&p.x<r.x+r.w+pad&&p.y>r.y-pad&&p.y<r.y+r.h+pad; }

function boardType(stage){
  if (isBoss(stage)){
    const k = chapter(stage).boss.kind;
    return k === 'triple' ? 'series' : k;
  }
  if (S.breather) return 'single';
  if (stage <= 3) return 'single';
  if (stage === 4) return 'series';   // meet series, then the chapter 1 boss tests it
  if (stage === 7) return 'parallel'; // meet parallel at the top of chapter 2
  if (stage <  7)  return 'single';
  const r=RND();
  return r < 0.42 ? 'single' : r < 0.71 ? 'series' : 'parallel';
}

function genBoard(){
  if (typeof cancelPending==='function') cancelPending();
  // Difficulty should be a sawtooth, not a ramp: an easier board after a hard
  // one gives the curve a rhythm instead of a relentless climb.
  // Never ease off on a stage that teaches something new (4 = series,
  // 6 = parallel). Those are mastery moments, not places for a let-up.
  S.boss = isBoss(S.stage) ? chapter(S.stage).boss : null;
  // a boss is the point of the chapter; never soften one into a breather
  S.breather = !S.boss && !isTeaching(S.stage) && S.stage > 6
             && (S.needBreather || chapStep(S.stage) === 1);
  S.needBreather = false;
  S.voltClimb = 0;
  // A new board owns the screen. Without this, an overlay left showing from a
  // previous outcome sits on top of the canvas and silently swallows every
  // touch — the board looks playable and does not respond.
  ['over','draft','resolder','lab'].forEach(id=>{ const e=$(id); if(e) e.classList.remove('show'); });
  const BW=CFG.BW;
  S.type = boardType(S.stage);
  S.lamps=[]; S.obs=[]; S.branches=[]; S.bi=0; S.viaHit=false;
  S.copperUsed=0; S.maxHeat=0; S.burn=null; S.supplyI=0; S.slowmo=0; S.parts=[];

  if (S.stage === 1){
    // Crafted first board: short, unobstructed, low supply. Teaches by playing.
    S.src = { x:1.4, y:BH*0.68 };
    S.lamps=[{ x:BW-1.4, y:BH*0.34, R:CFG.R_LOAD, I:0, glow:0 }];
    S.branches=[{ pts:[], heat:[], lamps:[0], done:false, R:0, I:0, copper:0 }];
  } else if (S.type === 'parallel'){
    const mid=BH/2+rand(-BH*0.05,BH*0.05);
    S.src={ x:rand(0.9,1.5), y:mid };
    const sp=rand(BH*0.18,BH*0.30);
    S.lamps=[{x:rand(BW-1.7,BW-0.9),y:clamp(mid-sp,1.2,BH-1.2),R:CFG.R_LOAD,I:0,glow:0},
             {x:rand(BW-1.7,BW-0.9),y:clamp(mid+sp,1.2,BH-1.2),R:CFG.R_LOAD,I:0,glow:0}];
    S.branches=[{pts:[],heat:[],lamps:[0],done:false,R:0,I:0,copper:0},
                {pts:[],heat:[],lamps:[1],done:false,R:0,I:0,copper:0}];
  } else if (S.type === 'series'){
    const nL = (S.boss && S.boss.kind==='triple') ? 3 : 2;
    const mid=BH/2+rand(-BH*0.08,BH*0.08); let flip=RND()<0.5?-1:1;
    S.src={ x:rand(0.9,1.5), y:clamp(mid-rand(BH*0.16,BH*0.28)*flip,1.2,BH-1.2) };
    S.lamps=[];
    for (let i=0;i<nL;i++){
      const fx = (i+1)/(nL+0.28);
      flip = -flip;
      S.lamps.push({ x: clamp(BW*(0.30+fx*0.62)+rand(-0.3,0.3), 2.2, BW-0.9),
                     y: clamp(mid + rand(BH*0.12,BH*0.26)*flip, 1.2, BH-1.2),
                     R:CFG.R_LOAD, I:0, glow:0 });
    }
    S.branches=[{pts:[],heat:[],lamps:S.lamps.map((_,i)=>i),done:false,R:0,I:0,copper:0}];
  } else {
    const mid=BH/2+rand(-BH*0.09,BH*0.09), flip=RND()<0.5?-1:1;
    const half=rand(BH*0.17,BH*0.34)*((S.boss&&S.boss.spread)||1);
    S.src={ x:rand(0.9,1.7), y:clamp(mid-half*flip,1.2,BH-1.2) };
    S.lamps=[{x:rand(BW-1.7,BW-0.9),y:clamp(mid+half*flip,1.2,BH-1.2),R:CFG.R_LOAD,I:0,glow:0}];
    S.branches=[{pts:[],heat:[],lamps:[0],done:false,R:0,I:0,copper:0}];
  }

  // keep-out zones seeded on the routes
  let n = S.stage===1 ? 0 : Math.min(Math.floor((S.stage-1)/2)+1, 4);
  if (S.breather) n = Math.max(0, n-2);
  if (isTeaching(S.stage)) n = Math.max(0, n-1);   // meeting a new mechanic
  if (S.boss && S.boss.obs) n = Math.max(0, n + S.boss.obs);
  let guard=0;
  while (S.obs.length<n && guard++<300){
    const tgt = S.lamps[(RND()*S.lamps.length)|0];
    const t=rand(0.20,0.80);
    const kx=lerp(S.src.x,tgt.x,t)+rand(-0.9,0.9);
    const ky=lerp(S.src.y,tgt.y,t)+rand(-1.7,1.7);
    const w=rand(0.9,2.0), h=rand(1.3,Math.min(BH*0.38,5.0));
    const r={x:clamp(kx-w/2,2.2,BW-2.4-w),y:clamp(ky-h/2,0.4,BH-0.4-h),w,h};
    if (rectHit(S.src,r,1.15)) continue;
    if (S.lamps.some(L=>rectHit(L,r,1.15))) continue;
    if (S.obs.some(o=>!(r.x>o.x+o.w+0.5||r.x+r.w<o.x-0.5||r.y>o.y+o.h+0.5||r.y+r.h<o.y-0.5))) continue;
    S.obs.push(r);
  }

  // supply sized to this board's geometry so difficulty is layout-independent
  const teaching = isTeaching(S.stage);
  let ramp = (1 + CFG.V_RAMP*(S.stage-1)*(S.daily ? 1 : META.skill))
           * (S.breather ? 0.80 : 1) * (teaching ? 0.86 : 1);
  let boost = 1;
  const size = ()=>{
    let dSum=0;
    for (const b of S.branches){
      let from=S.src;
      for (const li of b.lamps){ dSum+=dist(from,S.lamps[li]); from=S.lamps[li]; }
    }
    const loadPer = S.branches[0].lamps.length * CFG.R_LOAD;
    S.volts  = CFG.I_REF*(rho()*(dSum/S.branches.length)/CFG.W_REF + loadPer) * ramp * S.mods.volt;
    S.budget = CFG.BUDGET(dSum) * S.mods.budget * (1 + 0.07*S.obs.length) * boost;
    S.fuse   = S.type==='parallel' ? CFG.FUSE_PARALLEL*S.mods.imax : Infinity;
    if (S.boss){
      if (S.boss.fuse)  S.fuse   = S.boss.fuse * S.mods.imax;
      if (S.boss.climb){ S.volts *= 0.80; S.voltClimb = 0.172; }
    }
  };
  if (S.boss && S.boss.cool) S.mods.cool *= S.boss.cool;
  size();
  // Ease the board until a competent route has real headroom. Clearing a
  // keep-out zone is the gentlest lever, so spend those first; only then
  // back off the supply.
  // Clearing a keep-out zone shortens the route, which helps whatever is
  // wrong, so spend those first. After that the lever has to match the
  // complaint: a starved lamp wants more supply, a hot trace wants less, and
  // a route you cannot afford wants more copper.
  const floor = S.boss ? CFG.MIN_MARGIN_BOSS : CFG.MIN_MARGIN;
  const keepZones = !!(S.boss && S.boss.obs > 0);
  let ease=0;
  while (ease++ < 40){
    const r = boardMargin();
    if (r.m >= floor) break;
    if (ease > 10 && S.obs.length && !keepZones) S.obs.pop();
    else if (r.bind === 'copper') boost *= 1.07;
    else if (r.bind === 'under')  ramp  *= 1.04;
    else                          ramp  *= 0.97;
    size();
  }
  S.genMargin = +boardMargin().m.toFixed(3);
  S.phase='draw';
  buildGauges();
  chapterUI();
  banner();
  if (S.boss) showBoss();
}

// Best margin a competent player could reach on this board, across every
// constraint at once. Negative means even a perfect route violates something.
function boardMargin(){
  let dSum=0;
  for (const b of S.branches){
    let from=S.src;
    for (const li of b.lamps){ dSum+=dist(from,S.lamps[li]); from=S.lamps[li]; }
  }
  const routes=S.branches.length;
  // Route length has to be estimated ACCURATELY, not generously. Measured
  // against real A* routes, keep-out zones add about 6% each - they are placed
  // on the line but are usually skirted, not circled. Over-estimating is the
  // dangerous direction: a longer assumed route implies more resistance, so
  // the check believes the current is lower and cooler than it really is, and
  // waves through a board that burns every time.
  const L=(dSum/routes)*(1+0.06*S.obs.length);
  const V=S.volts*(S.voltClimb?Math.exp(S.voltClimb*CFG.LIVE_MS/1000):1);
  const load=S.branches[0].lamps.length*CFG.R_LOAD;
  const share=S.budget/routes;
  let best={m:-Infinity,bind:'none'};
  for(let k=0;k<=40;k++){
    const w=wMin()+(wMax()-wMin())*k/40;
    const I=V/(rho()*L/w+load);
    if (routes>1 && I*routes>S.fuse) continue;
    const hSS=(I*I*rho()/(w*w))*CFG.K_HEAT/(CFG.K_COOL*S.mods.cool);
    const c={ under:(I-CFG.I_MIN)/CFG.I_MIN, over:(iMax()-I)/iMax(),
              heat:(hBurn()-hSS)/hBurn(), copper:(share-L*w)/Math.max(share,0.01) };
    let bind='under', m=Infinity;
    for(const k in c) if(c[k]<m){ m=c[k]; bind=k; }
    if(m>best.m) best={m,bind};
  }
  return best;
}

/* ---------------- solver ---------------- */
function solve(){
  let supply=0;
  for (const b of S.branches){
    let R=0;
    for (let i=1;i<b.pts.length;i++){
      const a=b.pts[i-1], c=b.pts[i];
      R += rho()*Math.hypot(c.x-a.x,c.y-a.y)/((a.w+c.w)/2);
    }
    b.R=R;
    const load=b.lamps.reduce((s,i)=>s+S.lamps[i].R,0);
    b.I = b.pts.length>1 ? S.volts/(R+load) : 0;
    supply += b.I;
    for (const li of b.lamps) S.lamps[li].I = b.I;
  }
  S.supplyI = supply;
}
const densityAt=(b,i)=> (b.I*b.I*rho())/(b.pts[i].w*b.pts[i].w);
const curBranch=()=> S.branches[S.bi];
const totalCopper=()=> S.branches.reduce((t,b)=>t+(b.copper||0),0);
// A slip resets the stroke you were drawing, never the branches you already
// finished. Wiping a good branch because you brushed a keep-out zone on the
// next one is the kind of unfairness that makes people close the app.
function resetBranch(b){
  b.pts=[]; b.heat=[]; b.copper=0; b.done=false; b.R=0; b.I=0;
  for (const li of b.lamps) { S.lamps[li].I=0; S.lamps[li].glow=0; }
  S.viaHit=false; S.copperUsed=totalCopper(); solve();
}
const allDone =()=> S.branches.every(b=>b.done);

/* ---------------- input ---------------- */
let last=null,lastT=0,curW=CFG.W_MAX,drawSpeed=0;
const toU=(e)=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/unit,y:(e.clientY-r.top)/unit}; };
function blocked(p,w){
  for (const o of S.obs) if (rectHit(p,o,w/2)) return true;
  return p.x<-0.1||p.x>CFG.BW+0.1||p.y<-0.1||p.y>BH+0.1;
}
function resetAll(){
  for (const b of S.branches){ b.pts=[]; b.heat=[]; b.copper=0; b.done=false; b.R=0; b.I=0; }
  for (const L of S.lamps){ L.I=0; L.glow=0; }
  S.bi=0; S.viaHit=false; S.copperUsed=0; S.supplyI=0; banner();
}

cv.addEventListener("pointerdown",(e)=>{
  A.init(); A.resume();
  if (S.phase!=='draw') return;
  const p=toU(e);
  if (dist(p,S.src)>1.05){ A.nope(); return; }
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  const b=curBranch(); if(!b) return;
  b.pts=[{x:S.src.x,y:S.src.y,w:wMax()}]; b.heat=[0]; b.done=false; b.copper=0;
  S.copperUsed=totalCopper();
  S.viaHit=false; S.drawing=true; curW=wMax();
  last={x:S.src.x,y:S.src.y}; lastT=(e.timeStamp||performance.now());
  A.clack();
});

cv.addEventListener("pointermove",(e)=>{
  if(!S.drawing) return; e.preventDefault();
  // Trace width comes from drag speed, so how we time the drag matters.
  // performance.now() inside the handler measures when the browser got round
  // to calling us, not when the finger moved — and browsers coalesce pointer
  // events under load, so a steady drag can arrive as a burst and read as a
  // flick. e.timeStamp is the browser's own event time and is immune to that.
  const b=curBranch(), p=toU(e), now=(e.timeStamp||performance.now());
  // 8 ms floor: no real finger outruns 125 Hz, so anything quicker is an
  // event-delivery artefact rather than the player actually flicking.
  const dt=Math.max((now-lastT)/1000,0.008), d=dist(p,last);
  if (d<CFG.STEP*0.75) return;

  const sample=Math.min(d/dt, CFG.SPEED_MAX*1.5);
  drawSpeed=lerp(drawSpeed,sample,0.4);
  const target=lerp(wMax(),wMin(),clamp(drawSpeed/CFG.SPEED_MAX,0,1));
  A.scratch(clamp(drawSpeed/CFG.SPEED_MAX,0,1)*0.9+0.1);

  const steps=Math.max(1,Math.round(d/CFG.STEP));
  for (let s=1;s<=steps;s++){
    const t=s/steps, q={x:lerp(last.x,p.x,t),y:lerp(last.y,p.y,t)};
    curW=lerp(curW,target,0.35);
    let w=clamp(curW,wMin(),wMax());
    const prev=b.pts[b.pts.length-1];
    const segL=Math.hypot(q.x-prev.x,q.y-prev.y);
    if (segL<1e-5) continue;
    const left=S.budget-S.copperUsed;
    if (left<=0.001){ endStroke(false); return; }
    if (segL*w>left) w=Math.max(wMin()*0.55,left/segL);
    if (blocked(q,w)){ endStroke(false); A.nope(); return; }
    b.pts.push({x:q.x,y:q.y,w}); b.heat.push(0);
    b.copper+=segL*w; S.copperUsed=totalCopper();
  }
  last=p; lastT=now; solve();

  // series: must pass through the first lamp before reaching the second
  if (b.lamps.length>1 && !S.viaHit && dist(p,S.lamps[b.lamps[0]])<0.7){
    S.viaHit=true; A.clack(); banner();
  }
  const goal=S.lamps[b.lamps[b.lamps.length-1]];
  const ready = b.lamps.length===1 || S.viaHit;
  if (ready && dist(p,goal)<0.72 && b.pts.length>4) endStroke(true);
},{passive:false});

cv.addEventListener("pointerup",(e)=>{
  if(!S.drawing) return;
  const b=curBranch(), p=toU(e);
  const goal=S.lamps[b.lamps[b.lamps.length-1]];
  const ready = b.lamps.length===1 || S.viaHit;
  endStroke(ready && dist(p,goal)<0.95 && b.pts.length>4);
});
cv.addEventListener("pointercancel",()=>{ if(S.drawing) endStroke(false); });

function endStroke(connected){
  S.drawing=false; A.scratch(0);
  const b=curBranch();
  if (!connected){ resetBranch(b); banner(); A.nope(); return; }
  const goal=S.lamps[b.lamps[b.lamps.length-1]];
  b.pts.push({x:goal.x,y:goal.y,w:b.pts[b.pts.length-1].w}); b.heat.push(0);
  b.done=true; solve();
  if (allDone()) energize();
  else { S.bi++; S.viaHit=false; A.clack(); banner(); }
}

/* ---------------- live phase ---------------- */
function energize(){ S.phase='live'; S.liveT=0; S.maxHeat=0; S.burn=null; solve(); banner(); A.clack(); }

function stepPhysics(dt){
  S.liveT+=dt*1000;
  if (S.voltClimb){ S.volts *= (1 + S.voltClimb*dt); solve(); }

  if (S.supplyI > S.fuse){ if (S.liveT>340) return fail('FUSE'); return; }

  const over = S.lamps.find(L=>L.I>iMax());
  if (over){ for(const L of S.lamps) L.glow=Math.min(1.6,L.glow+dt*7);
             if (S.liveT>420) return fail('POPPED'); return; }

  const dark = S.lamps.some(L=>L.I<CFG.I_MIN);
  if (dark){ if (S.liveT>CFG.DARK_MS) return fail('DARK'); }
  // eased, not linear — a filament does not come up at a constant rate
  for (const L of S.lamps) L.glow = L.I>=CFG.I_MIN
    ? L.glow + (1-L.glow)*Math.min(1,dt*7) : Math.max(0,L.glow-dt*3.5);

  let hi=0, hiB=null, hiI=0;
  for (const b of S.branches){
    const n=b.pts.length; if(n<3) continue;
    const nh=new Array(n);
    for (let i=0;i<n;i++){
      if (i<3||i>n-4){ nh[i]=0; continue; }   // pads and lamp terminals are pours: they sink heat
      const q=densityAt(b,i);
      const diff=(b.heat[i-1]-b.heat[i])+(b.heat[i+1]-b.heat[i]);
      let v=b.heat[i]+(q*CFG.K_HEAT - b.heat[i]*CFG.K_COOL*S.mods.cool + diff*CFG.K_DIFF*S.mods.diff)*dt;
      nh[i]=v<0?0:v;
      if (nh[i]>hi){ hi=nh[i]; hiB=b; hiI=i; }
    }
    b.heat=nh;
  }
  S.maxHeat=hi/hBurn();
  A.hum(S.supplyI/Math.max(S.fuse,0.01), S.maxHeat);
  if (hi>=hBurn()){ S.burn={b:hiB,i:hiI}; return fail('BURNED'); }
  if (S.liveT>CFG.LIVE_MS) return succeed();
}

function spark(pt,count){
  for (let k=0;k<count;k++){
    const a=rand(0,Math.PI*2), s=rand(1.2,7.5);
    S.parts.push({x:pt.x,y:pt.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:rand(0.02,0.06)});
  }
}

function fail(kind){
  A.hum(0,0);
  S.lastFail=kind;
  const pt = S.burn ? S.burn.b.pts[S.burn.i] : S.lamps[0];
  if (kind==='FUSE'){ A.trip(); } else { A.pop(); }
  S.shake=9; spark(pt, kind==='BURNED'?38:26);
  S.freeze=90;   // animators call it a hold; nothing moves for a beat
  if (kind==='BURNED'){ S.phase='burning'; S.slowmo=CFG.SLOWMO_MS; }
  else { S.phase='burning'; S.slowmo=520; }
  const worst = S.lamps.reduce((a,L)=>L.I>a?L.I:a,0);
  const least = S.lamps.reduce((a,L)=>L.I<a?L.I:a,1e9);
  S.failText = {
    BURNED:['Burned out','The trace opened at its thinnest point. Power density is <b>I&sup2;&rho;/w&sup2;</b> &mdash; halve the width and you quadruple the heat there.'],
    POPPED:['Filament blown', mA(worst)+' mA into a lamp rated to '+mA(iMax())+' mA. At this supply you have to <b>add</b> resistance &mdash; longer route, or thinner copper.'],
    DARK:['No light','Only '+mA(least)+' mA reached a lamp that needs '+mA(CFG.I_MIN)+' mA. Too much resistance in the trace &mdash; thicker, or shorter.'],
    FUSE:['Supply tripped','Both branches together drew '+mA(S.supplyI)+' mA past a '+mA(S.fuse)+' mA fuse. Parallel branches add their currents at the supply.']
  }[kind];
  flash(S.failText[0],'var(--hot)');
}

function afterBurn(){
  if (S.daily){ startDaily(); return; }   // unlimited attempts: the barrier stays low
  const kind=S.lastFail;
  if (kind==='BURNED' && S.solder>0){
    S.phase='offer';
    $("overwhy2").innerHTML=S.failText[1];
    $("rcount").textContent = S.solder+' re-solder'+(S.solder===1?'':'s')+' left · chain resets';
    $("resolder").classList.add("show");
  } else endRun();
}

let pendTimer=null;
function later(fn,ms){ clearTimeout(pendTimer); pendTimer=setTimeout(fn,ms); }
function cancelPending(){ clearTimeout(pendTimer); pendTimer=null; }

function succeed(){
  S.phase='result'; A.hum(0,0); A.ding();
  if (S.daily){
    const head = Math.round((1-clamp(S.maxHeat,0,1))*100);
    completeDaily(head);
    flash('Daily clear','var(--copper)','streak ' + META.streak + '   ·   ' + head + '% headroom');
    later(()=>dailyResult(head), 1500);
    return;
  }
  S.chain++; if (S.chain>1) A.chain(S.chain);
  const eff=1-clamp(S.copperUsed/S.budget,0,1);
  const cool=1-clamp(S.maxHeat,0,1);
  const cm=1+0.25*Math.min(S.chain-1,6);
  const gained=Math.round((100*S.stage+200*eff+150*cool)*S.mods.score*cm);
  S.score+=gained;
  if(!META.taught){ META.taught=true; save(); }
  // adaptive pacing: cruising raises the ramp, struggling lowers it
  if (S.maxHeat<0.5 && eff>0.3) META.skill=clamp(META.skill+0.03,0.78,1.32);
  if (S.maxHeat>0.72) S.needBreather=true;   // that one was close — ease off next
  if (S.boss) flash('Sector clear','var(--copper)', chapter(S.stage).name + '   ·   +' + gained);
  else flash('Held','var(--ok)','+'+gained+(cm>1?'   ×'+cm.toFixed(2)+' chain':'')+'   ·   '+Math.round(cool*100)+'% headroom');
  const forStage=S.stage;
  later(()=>{
    if (S.stage!==forStage) return;            // board changed under us
    if (S.stage%CFG.DRAFT_EVERY===0) openDraft();
    else { S.stage++; genBoard(); }
  },1150);
}

function endRun(){
  S.phase='over';
  $("resolder").classList.remove("show");
  META.runs++;
  META.skill=clamp(META.skill-0.06,0.78,1.32);
  S.rpRun = Math.floor(S.score/12) + 5*(S.stage-1);
  META.rp += S.rpRun;
  if (S.score>META.best) META.best=S.score;
  save();
  $("over-big").textContent=S.failText[0];
  $("overwhy").innerHTML=S.failText[1];
  $("s-stage").textContent=S.stage-1;
  $("s-score").textContent=S.score;
  $("s-best").textContent=META.best;
  $("s-rp").textContent='+'+S.rpRun;
  unlockBar();
  $("over-title").textContent = 'Run ended';
  setText('s-stage-k','Stages'); setText('s-score-k','Score');
  setText('s-best-k','Best'); setText('s-rp-k','Research');
  $("tolab").style.display = META.runs>=2 ? '' : 'none';
  $("unlockbar").style.display = '';
  dailyButton();
  $("over").classList.add("show");
}

function unlockBar(){
  let cheapest=null, cost=Infinity;
  for (const u of UPG){ const l=lvl(u.id); if(l>=u.max) continue;
    const c=u.cost(l); if(c<cost){cost=c;cheapest=u;} }
  if (!cheapest){ $("ubname").textContent='All upgrades bought'; $("ubval").textContent=META.rp+' RP';
                  $("ubfill").style.width='100%'; return; }
  $("ubname").textContent='Next: '+cheapest.n;
  $("ubval").textContent=META.rp+' / '+cost+' RP';
  $("ubfill").style.width=clamp(META.rp/cost,0,1)*100+'%';
}

function flash(text,color,sub){
  const v=$("verdict");
  v.innerHTML=text+(sub?'<span class="sub">'+sub+'</span>':'');
  v.style.color=color; v.style.opacity=1;
  setTimeout(()=>{v.style.opacity=0;}, sub?1050:1500);
}
function banner(){
  const el=$("banner");
  let t='';
  if (S.breather && S.phase==='draw' && !S.branches.some(b=>b.pts.length)) t='Breather — supply eased off';
  else
  if (S.daily && S.phase==='draw') t='Everyone gets this board today';
  else if (S.type==='parallel' && S.branches.length>1 && S.phase==='draw')
    t = allDone()?'':'Branch '+(S.bi+1)+' of 2  ·  fuse '+mA(S.fuse)+' mA';
  else if (S.type==='series' && S.phase==='draw')
    t = S.viaHit ? 'Now on to the second lamp' : 'Series — run the trace through both lamps';
  el.textContent=t; el.style.opacity = t?1:0;
}

/* ---------------- draft ---------------- */
const MODS=[
  {n:'Silver ink',      v:'ρ × 0.78',        d:'Lower resistivity. More current for the same width.',        f:m=>m.rho*=0.78},
  {n:'Heat-sink plane', v:'burn × 1.40',     d:'Copper tolerates more heat before it opens.',                f:m=>m.burn*=1.40},
  {n:'Forced air',      v:'cooling × 1.55',  d:'Heat sheds faster. Live longer at the edge.',                f:m=>m.cool*=1.55},
  {n:'Wide nib',        v:'w max × 1.30',    d:'Lay thicker copper at the same drag speed.',                 f:m=>m.wmax*=1.30},
  {n:'Deep reserves',   v:'copper × 1.35',   d:'More copper to spend on every board.',                       f:m=>m.budget*=1.35},
  {n:'Rated filament',  v:'I max × 1.25',    d:'Lamps take more current before they pop.',                   f:m=>m.imax*=1.25},
  {n:'Thermal mass',    v:'diffusion × 1.6', d:'Heat spreads into neighbouring copper. Short pinches live.', f:m=>m.diff*=1.6},
  {n:'Fine nib',        v:'w min × 0.70',    d:'Draw thinner. Cheaper routes, hotter pinches.',              f:m=>{m.wmin*=0.70;m.budget*=1.10;}},
  {n:'Overvolt',        v:'V × 1.22 · score × 1.6', d:'Push the supply. Everything harder, everything worth more.', f:m=>{m.volt*=1.22;m.score*=1.6;}}
];
function openDraft(){
  S.phase='draft';
  const pool=MODS.slice(), picks=[];
  while (picks.length<3&&pool.length) picks.push(pool.splice((Math.random()*pool.length)|0,1)[0]);
  const wrap=$("cards"); wrap.innerHTML='';
  picks.forEach(m=>{
    const b=document.createElement('button'); b.className='card';
    b.innerHTML='<span class="cn">'+m.n+'</span><span class="cd">'+m.d+'</span><span class="cv">'+m.v+'</span>';
    b.addEventListener('click',()=>{ m.f(S.mods); A.ding();
      $("draft").classList.remove("show"); S.stage++; genBoard(); });
    wrap.appendChild(b);
  });
  $("draft-big").textContent='Stage '+S.stage+' clear';
  $("draft").classList.add("show");
}

/* ---------------- lab ---------------- */
function renderLab(){
  $("rp").textContent=META.rp+' RP';
  const g=$("labgrid"); g.innerHTML='';
  UPG.forEach(u=>{
    const l=lvl(u.id), maxed=l>=u.max, cost=maxed?0:u.cost(l);
    const b=document.createElement('button');
    b.className='node'; b.disabled = maxed || META.rp<cost;
    let pips=''; for(let i=0;i<u.max;i++) pips+='<i class="'+(i<l?'on':'')+'"></i>';
    b.innerHTML='<span class="nn">'+u.n+'</span><span class="nd">'+u.d+'</span>'+
      '<span class="nf"><span class="pips">'+pips+'</span>'+
      '<span class="cost'+(maxed?' max':'')+'">'+(maxed?'MAX':cost+' RP')+'</span></span>';
    b.addEventListener('click',()=>{
      const cl=lvl(u.id); if(cl>=u.max) return;
      const c=u.cost(cl); if(META.rp<c) return;
      META.rp-=c; META.up[u.id]=cl+1; save(); A.ding(); renderLab(); unlockBar();
    });
    g.appendChild(b);
  });
}
$("tolab").addEventListener("click",()=>{
  renderLab(); $("over").classList.remove("show"); $("lab").classList.add("show"); });
$("labclose").addEventListener("click",()=>{
  $("lab").classList.remove("show"); unlockBar(); $("over").classList.add("show"); });

/* ---------------- the daily board ---------------- */
// Everyone gets the same board each day, seeded from the date, with lab
// upgrades and personal difficulty adaptation switched off so it is the same
// puzzle for everyone.
//
// Deliberately easy to keep: unlimited retries, and the streak asks only that
// you clear it. Duolingo ran 600 experiments and found that making a streak
// EASIER to maintain increased long-term engagement - the streak and the
// ambitious goal should be separate things. Here the ambitious goal is your
// best thermal headroom, tracked but never required.
//
// A missed day is covered by a spare fuse, and spare fuses are earned by
// playing, never sold. No copy anywhere asks you not to give up.
function startDaily(){
  cancelPending();
  ['over','draft','resolder','lab'].forEach(id=>$(id).classList.remove('show'));
  S.daily = true; S.stage = 5; S.chain = 0; S.score = 0; S.solder = 0; S.parts = [];
  S.mods = { rho:1, burn:1, cool:1, wmax:1, wmin:1, budget:1, imax:1, volt:1, score:1, diff:1 };
  RND = mulberry32((dayNum() * 2654435761) >>> 0);
  genBoard();
  RND = Math.random;          // only the board is seeded, nothing after it
  banner();
}

function dailyDone(){ return META.dailyDay === dayNum(); }

function completeDaily(headroom){
  if (headroom > (META.dailyBest||0)) META.dailyBest = headroom;
  const d = dayNum();
  if (META.dailyDay !== d){
    const gap = META.dailyDay === null ? 999 : d - META.dailyDay;
    if (gap === 1) META.streak++;
    else if (gap === 2 && META.freezes > 0){ META.freezes--; META.streak++; }  // a spare fuse covers one missed day
    else META.streak = 1;
    META.dailyDay = d;
    META.daysPlayed = (META.daysPlayed||0) + 1;
    if (META.daysPlayed % 5 === 0) META.freezes = Math.min(2, (META.freezes||0) + 1);
  }
  save();
}

function dailyResult(headroom){
  S.daily = false;
  $("over-title").textContent = 'Daily board';
  $("over-big").textContent   = 'Daily clear';
  $("overwhy").innerHTML = META.freezes
    ? 'You are holding ' + META.freezes + ' spare fuse' + (META.freezes>1?'s':'') +
      '. A spare fuse covers one missed day.'
    : 'Play five days to earn a spare fuse. It covers one missed day.';
  setText('s-stage-k','Streak'); setText('s-score-k','Headroom'); setText('s-best-k','Your best');
  $("s-stage").textContent = String(META.streak);
  $("s-score").textContent = headroom + '%';
  $("s-best").textContent  = (META.dailyBest||0) + '%';
  $("s-rp").textContent    = String(META.freezes||0);
  setText('s-rp-k','Fuses');
  $("unlockbar").style.display = 'none';
  $("tolab").style.display = META.runs>=2 ? '' : 'none';
  $("todaily").style.display = 'none';
  $("over").classList.add("show");
}

function dailyButton(){
  const b = $("todaily");
  b.style.display = '';
  if (dailyDone()) { b.textContent = 'Daily done · ' + META.streak; b.disabled = true; }
  else { b.textContent = META.streak ? 'Daily · streak ' + META.streak : 'Daily board'; b.disabled = false; }
}
$("todaily").addEventListener("click", ()=>{ if(!dailyDone()) startDaily(); });

/* ---------------- run control ---------------- */
function newRun(){
  cancelPending();
  S.daily = false;
  $("draft").classList.remove("show"); $("resolder").classList.remove("show");
  $("over").classList.remove("show"); $("lab").classList.remove("show");
  S.stage=1; S.score=0; S.chain=0; S.parts=[]; S.sawChain=false; S.needBreather=false;
  S.solder = 1 + lvl('solder');
  S.mods = baseMods();
  genBoard(); showTitle();
}
$("again").addEventListener("click", newRun);
$("do-resolder").addEventListener("click",()=>{
  S.solder--; S.chain=0;
  $("resolder").classList.remove("show");
  A.clack(); resetAll(); S.parts=[]; S.phase='draw';
});
$("no-resolder").addEventListener("click", endRun);

/* ---------------- rendering ---------------- */
const RAMP=[[0,[176,106,56]],[0.35,[212,86,44]],[0.62,[242,128,47]],[0.84,[255,194,77]],[1,[255,243,214]]];
function heatCol(h,alpha){
  h=clamp(h,0,1); let a=RAMP[0],b=RAMP[RAMP.length-1];
  for(let i=0;i<RAMP.length-1;i++) if(h>=RAMP[i][0]&&h<=RAMP[i+1][0]){a=RAMP[i];b=RAMP[i+1];break;}
  const t=(h-a[0])/Math.max(b[0]-a[0],1e-6);
  const c=[0,1,2].map(k=>Math.round(lerp(a[1][k],b[1][k],t)));
  return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(alpha===undefined?1:alpha)+')';
}
function drawBg(){
  const ch=chapter(S.stage);
  cx.fillStyle=ch.sub; cx.fillRect(-30,-30,cssW+60,cssH+60);
  cx.fillStyle=ch.grid;
  for(let y=0.5;y<BH;y+=0.5) for(let x=0.5;x<CFG.BW;x+=0.5) cx.fillRect(px(x)-0.5,px(y)-0.5,1,1);
}
function drawObstacles(){
  for(const o of S.obs){
    const X=px(o.x),Y=px(o.y),W=px(o.w),H=px(o.h);
    cx.fillStyle='#080A0B'; cx.fillRect(X,Y,W,H);
    cx.save(); cx.beginPath(); cx.rect(X,Y,W,H); cx.clip();
    cx.strokeStyle='rgba(255,90,60,0.13)'; cx.lineWidth=1;
    for(let d=-H;d<W;d+=9){cx.beginPath();cx.moveTo(X+d,Y+H);cx.lineTo(X+d+H,Y);cx.stroke();}
    cx.restore();
    cx.strokeStyle='rgba(255,90,60,0.32)'; cx.lineWidth=1; cx.strokeRect(X+0.5,Y+0.5,W-1,H-1);
  }
}
function drawBranch(b){
  const P=b.pts; if(P.length<2) return;
  cx.lineCap='round'; cx.lineJoin='round';
  cx.globalCompositeOperation='lighter';
  for(let i=1;i<P.length;i++){
    const h=Math.max(b.heat[i-1]||0,b.heat[i]||0)/hBurn();
    if(h<0.10) continue;
    cx.strokeStyle=heatCol(h,0.13+0.30*h);
    cx.lineWidth=px((P[i-1].w+P[i].w)/2)*(1.9+2.4*h);
    cx.beginPath(); cx.moveTo(px(P[i-1].x),px(P[i-1].y)); cx.lineTo(px(P[i].x),px(P[i].y)); cx.stroke();
  }
  cx.globalCompositeOperation='source-over';
  const gapAt = (S.burn&&S.burn.b===b) ? S.burn.i : -1;
  for(let i=1;i<P.length;i++){
    if (gapAt>=0 && Math.abs(i-gapAt)<2) continue;         // the opened gap
    const h=Math.max(b.heat[i-1]||0,b.heat[i]||0)/hBurn();
    cx.strokeStyle=heatCol(h);
    cx.lineWidth=px((P[i-1].w+P[i].w)/2);
    cx.beginPath(); cx.moveTo(px(P[i-1].x),px(P[i-1].y)); cx.lineTo(px(P[i].x),px(P[i].y)); cx.stroke();
  }
  if(S.phase==='live'&&b.I>=CFG.I_MIN){
    cx.save(); cx.globalCompositeOperation='lighter';
    cx.setLineDash([px(0.16),px(0.52)]); cx.lineDashOffset=-S.dashOff;
    cx.strokeStyle='rgba(255,231,184,0.85)'; cx.lineWidth=px(0.065);
    cx.beginPath(); cx.moveTo(px(P[0].x),px(P[0].y));
    for(let i=1;i<P.length;i++) cx.lineTo(px(P[i].x),px(P[i].y));
    cx.stroke(); cx.setLineDash([]); cx.restore();
  }
}
function drawPads(){
  const t=performance.now()/1000;
  const sx=px(S.src.x),sy=px(S.src.y),r=px(0.40);
  if(S.phase==='draw'&&!S.drawing&&curBranch()&&curBranch().pts.length===0){
    const p=0.5+0.5*Math.sin(t*3.1);
    cx.strokeStyle='rgba(200,113,55,'+(0.14+0.30*p)+')'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(sx,sy,r*(1.5+0.65*p),0,Math.PI*2); cx.stroke();
  }
  cx.fillStyle='#C87137'; cx.beginPath(); cx.arc(sx,sy,r,0,Math.PI*2); cx.fill();
  cx.strokeStyle='#120A04'; cx.lineWidth=Math.max(2,r*0.22); cx.lineCap='round';
  cx.beginPath();
  cx.moveTo(sx-r*0.46,sy); cx.lineTo(sx+r*0.46,sy);
  cx.moveTo(sx,sy-r*0.46); cx.lineTo(sx,sy+r*0.46); cx.stroke();

  S.lamps.forEach((L,idx)=>{
    const lx=px(L.x),ly=px(L.y),lr=px(0.44),g=clamp(L.glow,0,1.6);
    if(g>0.02){
      const gr=cx.createRadialGradient(lx,ly,0,lx,ly,lr*(3.4+2.6*g));
      gr.addColorStop(0,'rgba(255,231,184,'+(0.60*Math.min(g,1))+')');
      gr.addColorStop(0.35,'rgba(255,196,120,'+(0.20*Math.min(g,1))+')');
      gr.addColorStop(1,'rgba(255,196,120,0)');
      cx.save(); cx.globalCompositeOperation='lighter'; cx.fillStyle=gr;
      cx.beginPath(); cx.arc(lx,ly,lr*(3.4+2.6*g),0,Math.PI*2); cx.fill(); cx.restore();
    }
    cx.fillStyle = g>0.05?'rgba(255,231,184,'+(0.25+0.70*Math.min(g,1))+')':'rgba(91,143,184,0.16)';
    cx.beginPath(); cx.arc(lx,ly,lr,0,Math.PI*2); cx.fill();
    cx.strokeStyle = g>0.05?'rgba(255,243,214,0.95)':'rgba(91,143,184,0.75)';
    cx.lineWidth=1.6; cx.beginPath(); cx.arc(lx,ly,lr,0,Math.PI*2); cx.stroke();
    cx.strokeStyle = g>0.05?'rgba(255,255,255,0.95)':'rgba(91,143,184,0.6)';
    cx.lineWidth=Math.max(1.4,lr*0.13); cx.beginPath();
    for(let k=0;k<=16;k++){
      const u=k/16,X=lx+lerp(-lr*0.5,lr*0.5,u),Y=ly+Math.sin(u*Math.PI*4)*lr*0.26;
      k?cx.lineTo(X,Y):cx.moveTo(X,Y);
    }
    cx.stroke();
    if(S.lamps.length>1){
      cx.fillStyle='rgba(237,230,220,0.55)';
      cx.font='600 '+Math.round(lr*0.62)+'px "IBM Plex Mono",monospace';
      cx.textAlign='center'; cx.fillText(String.fromCharCode(65+idx), lx, ly-lr*1.55);
    }
  });
}
function drawParticles(dt){
  cx.save(); cx.globalCompositeOperation='lighter';
  for(let i=S.parts.length-1;i>=0;i--){
    const p=S.parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=9*dt; p.vx*=0.985; p.life-=dt*1.05;
    if(p.life<=0){ S.parts.splice(i,1); continue; }
    cx.fillStyle='rgba(255,'+Math.round(150+100*p.life)+',120,'+p.life+')';
    cx.beginPath(); cx.arc(px(p.x),px(p.y),px(p.r)*p.life,0,Math.PI*2); cx.fill();
  }
  cx.restore();
}

/* ---------------- HUD ---------------- */
const cache={};
const setText=(id,v)=>{ if(cache[id]!==v){cache[id]=v; $(id).textContent=v;} };
const setHTML=(id,v)=>{ if(cache[id]!==v){cache[id]=v; $(id).innerHTML=v;} };

function buildGauges(){
  const g=$("gauges"); g.innerHTML='';
  let ticks=''; for(let i=1;i<9;i++) ticks+='<i class="gtick" style="left:'+(i/9*100)+'%"></i>';
  S.lamps.forEach((L,i)=>{
    const d=document.createElement('div'); d.className='gauge';
    d.innerHTML='<div class="gwin"></div>'+ticks+
      (S.lamps.length>1?'<div class="glab">'+String.fromCharCode(65+i)+'</div>':'')+
      '<div class="gneedle"></div>';
    g.appendChild(d);
  });
  const gm=CFG.GAUGE_MAX;
  g.querySelectorAll('.gwin').forEach(w=>{
    w.style.left=(CFG.I_MIN/gm*100)+'%';
    w.style.width=((iMax()-CFG.I_MIN)/gm*100)+'%';
  });
  setText("meterlabel", S.lamps.length>1?'Lamp currents':'Load current');
  cache["readout"]=null;
}
function hud(){
  setText("v-stage", String(S.stage));
  setHTML("v-volts", S.volts.toFixed(1)+'<small>V</small>');
  setText("v-score", String(S.score));
  const cm=1+0.25*Math.min(Math.max(S.chain-1,0),6);
  if (S.chain>1) S.sawChain=true;
  setText("v-combo", '×'+cm.toFixed(2));
  $("cell-combo").classList.toggle("flat", cm<=1);
  // A first-time player does not need a chain multiplier or a score before
  // either exists. Complexity arrives when it starts to mean something.
  $("cell-combo").classList.toggle("hidden", !S.sawChain);
  $("cell-score").classList.toggle("hidden", S.score===0 && S.stage===1);
  const left=clamp(1-S.copperUsed/S.budget,0,1);
  setHTML("v-copper", Math.round(left*100)+'<small>%</small>');
  const f=$("copperfill"); f.style.width=(left*100).toFixed(1)+'%';
  f.classList.toggle("low", left<0.18);

  const gm=CFG.GAUGE_MAX, needles=$("gauges").querySelectorAll('.gneedle');
  S.lamps.forEach((L,i)=>{
    const n=needles[i]; if(!n) return;
    n.style.left=(clamp(L.I/gm,0,1)*100)+'%';
    n.className='gneedle'+(L.I>iMax()?' over':(L.I>=CFG.I_MIN?' in':''));
  });

  const anyDrawn=S.branches.some(b=>b.pts.length>1);
  setHTML("readout", anyDrawn
    ? (S.branches.length>1
        ? 'supply <b>'+mA(S.supplyI)+'</b> / '+mA(S.fuse)+' mA fuse'
        : 'R <b>'+S.branches[0].R.toFixed(1)+'</b> Ω &nbsp;·&nbsp; <b>'+mA(S.lamps[0].I)+'</b> mA')
    : 'draw a trace');

  const h=$("hint");
  if(!META.taught && S.stage===1 && S.phase==='draw'){ h.style.opacity=1;
    setHTML("hint",'Drag from <b>+</b> to the lamp<br>Slow drag = <b>thick copper</b>');
  } else h.style.opacity=0;
}

/* ---------------- loop ---------------- */
let prevT=performance.now();
function frame(now){
  let dt=Math.min((now-prevT)/1000,0.05); prevT=now;
  if(S.freeze>0){ S.freeze-=dt*1000; dt=0; }
  if(S.phase==='live'){ stepPhysics(dt); S.dashOff+=S.supplyI*760*dt; }
  if(S.phase==='burning'){
    S.slowmo-=dt*1000;
    dt*=0.22;
    if(S.slowmo<=0) afterBurn();
  }
  cx.save();
  if(S.shake>0.2){ cx.translate(rand(-S.shake,S.shake),rand(-S.shake,S.shake)); S.shake*=0.86; }
  drawBg(); drawObstacles();
  for(const b of S.branches) drawBranch(b);
  drawPads(); drawParticles(dt);
  cx.restore();
  hud();
  requestAnimationFrame(frame);
}

function chapterUI(){
  const st=S.stage, ch=chapter(st);
  setHTML('chapname', S.daily
    ? 'Daily board <b>&middot; ' + (META.streak ? 'streak ' + META.streak : 'same for everyone') + '</b>'
    : ch.name + ' <b>&middot; sector ' + chapNum(st) + '</b>');
  const pips=$('chappips');
  pips.style.display = S.daily ? 'none' : '';
  if (S.daily) return;
  if (pips.childElementCount !== CFG.CHAPTER_LEN){
    pips.innerHTML='';
    for(let i=1;i<=CFG.CHAPTER_LEN;i++){
      const el=document.createElement('i');
      if(i===CFG.CHAPTER_LEN) el.className='boss';
      pips.appendChild(el);
    }
  }
  const step=chapStep(st);
  [...pips.children].forEach((el,i)=>{
    const k=i+1, boss=(k===CFG.CHAPTER_LEN);
    el.className=(boss?'boss ':'')+(k<step?'done':k===step?'now':'');
  });
}

function showBoss(){
  if(!S.boss) return;
  $('titlecard').classList.remove('show');   // never stack two cards
  setText('bosstitle', S.boss.title);
  setText('bossblurb', S.boss.blurb);
  const c=$('bosscard'); c.classList.add('show');
  setTimeout(()=>c.classList.remove('show'), 2600);
}

/* ---------------- identity, without a gate ---------------- */
// The name shows over the playable board and fades. It never costs a tap,
// which is the whole point: a menu is a wall between someone and the hook.
function showTitle(){
  const t=$("titlecard");
  $('bosscard').classList.remove('show');
  $("titlesub").textContent = META.runs > 0
    ? 'best ' + META.best.toLocaleString() + '   ·   ' + META.rp + ' RP banked'
    : '';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), META.runs > 0 ? 2200 : 1700);
}

/* ---------------- boot ---------------- */
(function viewport(){
  let m=document.querySelector('meta[name="viewport"]');
  if(!m){ m=document.createElement('meta'); m.name='viewport'; document.head.appendChild(m); }
  m.content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
})();
window.addEventListener("resize",()=>{resize();},{passive:true});
document.addEventListener("gesturestart",e=>e.preventDefault());
function boot(){
  resize();
  if(cssW<40){ requestAnimationFrame(boot); return; }
  S.solder=1+lvl('solder'); S.mods=baseMods();
  genBoard(); applyMute(); showTitle();
  requestAnimationFrame(frame);
}
boot();
</script>
